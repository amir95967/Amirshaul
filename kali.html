<!doctype html>
<html lang="he" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kali IT Boarding System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background-color: #020617; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      /* מסך כניסה */
      #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
      .auth-card { width: 100%; max-width: 22rem; background: #0f172a; border: 1px solid #1e293b; border-radius: 1.25rem; padding: 2rem; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
      .input-field { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 0.75rem; padding: 0.65rem 1rem; color: #fff; font-size: 0.9rem; margin-bottom: 0.75rem; outline: none; }
      .input-field:focus { border-color: #06b6d4; }
      .btn-cyan { display: block; width: 100%; padding: 0.75rem; background-color: #06b6d4; color: #000; text-align: center; font-weight: 700; border-radius: 0.75rem; border: none; cursor: pointer; transition: 0.2s; }
      .btn-cyan:hover { background-color: #22d3ee; }

      /* מערכת ניהול */
      #app-screen { display: none; min-height: 100vh; flex-direction: column; }
      @media (min-width: 768px) { #app-screen { flex-direction: row; } }
      .sidebar { width: 100%; max-width: 24rem; border-left: 1px solid #1e293b; background: rgba(15, 23, 42, 0.7); display: flex; flex-direction: column; padding: 1.25rem; }
      .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
      .user-card { padding: 0.85rem; border-radius: 0.75rem; background: #0f172a; border: 1px solid #1e293b; cursor: pointer; margin-bottom: 0.5rem; transition: 0.2s; }
      .user-card.active { border-color: #06b6d4; background: rgba(6, 182, 212, 0.1); }
      .task-row { padding: 1rem; background: #0f172a; border: 1px solid #1e293b; border-radius: 0.75rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
      .task-row.done { opacity: 0.5; text-decoration: line-through; }
      .del-btn { color: #64748b; background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 2px 6px; border-radius: 4px; }
      .del-btn:hover { color: #f43f5e; background: rgba(244, 63, 94, 0.1); }
    </style>
  </head>
  <body>

    <!-- 1. מסך התחברות -->
    <div id="auth-screen">
      <div class="auth-card">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔒</div>
        <h2 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.25rem;">כניסה למערכת IT</h2>
        <p class="font-mono" style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 1.25rem;">Kali Group Boarding System</p>
        <input type="password" id="pass-input" class="input-field font-mono" placeholder="הזן סיסמה" />
        <p id="auth-err" style="color: #f43f5e; font-size: 0.75rem; margin-bottom: 0.75rem; display: none;">סיסמה שגויה</p>
        <button onclick="handleLogin()" class="btn-cyan font-mono">התחבר</button>
      </div>
    </div>

    <!-- 2. מסך ניהול עובדים -->
    <div id="app-screen">
      <!-- סרגל צד -->
      <div class="sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
          <h1 class="font-mono" style="font-size: 1rem; font-weight: bold; color: #22d3ee;">⚡ IT BOARDING</h1>
          <button onclick="handleLogout()" class="font-mono" style="font-size: 0.75rem; color: #f43f5e; background: none; border: none; cursor: pointer;">יציאה</button>
        </div>

        <!-- טופס הוספת עובד -->
        <div style="background: #020617; padding: 1rem; border-radius: 0.75rem; border: 1px solid #1e293b; margin-bottom: 1rem;">
          <input type="text" id="u-name" class="input-field" style="padding: 0.45rem 0.75rem; font-size: 0.8rem;" placeholder="שם מלא" />
          <input type="email" id="u-email" class="input-field" style="padding: 0.45rem 0.75rem; font-size: 0.8rem;" placeholder="כתובת מייל" />
          <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
            <input type="text" id="u-dept" class="input-field" style="padding: 0.45rem 0.75rem; font-size: 0.8rem; margin-bottom: 0;" placeholder="מחלקה" />
            <select id="u-type" class="input-field" style="padding: 0.45rem 0.75rem; font-size: 0.8rem; margin-bottom: 0;">
              <option value="onboarding">קליטה (On)</option>
              <option value="offboarding">עזיבה (Off)</option>
            </select>
          </div>
          <button onclick="addUser()" class="btn-cyan font-mono" style="padding: 0.5rem; font-size: 0.8rem;">+ הוסף עובד ל-Cloud</button>
        </div>

        <!-- רשימת עובדים -->
        <div id="users-list" style="flex: 1; overflow-y: auto;"></div>
      </div>

      <!-- אזור משימות ראשי -->
      <div class="main-content" id="details-area"></div>
    </div>

    <script>
      const ACCESS_PIN = "123456";
      const SUPABASE_URL = "https://zlfywwidgafrkttixzez.supabase.co";
      const SUPABASE_KEY = "sb_publishable_M2omv18OIuF5ulkLbDhh7g_P1m1OLgU";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const ONBOARDING_TASKS = [
        'פתיחת משתמש ב-Active Directory / 365',
        'שיוך רישיונות (M365, Teams וכו׳)',
        'הוספה לקבוצות תפוצה ומחלקות',
        'הכנת מחשב נייד והתקנת תוכנות',
        'הגדרת גישת VPN / MFA',
        'מסירת ציוד ושליחת פרטי התחברות'
      ];

      const OFFBOARDING_TASKS = [
        'חסימת משתמש (Disable Account)',
        'איפוס סיסמה וניתוק מכל ה-Sessions',
        'המרת תיבה ל-Shared ושלילת רישיונות',
        'הסרה מכל קבוצות התפוצה וה-Security',
        'איסוף מחשב, ציוד היקפי וביטול שיוך ב-MDM',
        'גיבוי קבצי OneDrive/מחשב מקומי'
      ];

      let users = [];
      let selectedId = null;

      function init() {
        if (localStorage.getItem('kali_auth_valid') === 'true') {
          showDashboard();
        }
      }

      function handleLogin() {
        const pin = document.getElementById('pass-input').value;
        if (pin === ACCESS_PIN) {
          localStorage.setItem('kali_auth_valid', 'true');
          showDashboard();
        } else {
          document.getElementById('auth-err').style.display = 'block';
        }
      }

      function handleLogout() {
        localStorage.removeItem('kali_auth_valid');
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }

      async function showDashboard() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        await fetchUsers();
      }

      async function fetchUsers() {
        try {
          const { data, error } = await supabase.from('employees').select('*').order('created_at', { ascending: false });
          if (error) throw error;
          users = (data || []).map(u => ({
            id: u.id,
            name: u.name,
            email: u.email,
            department: u.department,
            type: u.type,
            completed: Array.isArray(u.completed) ? u.completed : []
          }));
          if (!selectedId && users.length > 0) selectedId = users[0].id;
          renderUsersList();
          renderSelected();
        } catch (e) {
          console.error(e);
        }
      }

      function renderUsersList() {
        const el = document.getElementById('users-list');
        el.innerHTML = '';
        if (users.length === 0) {
          el.innerHTML = '<div style="color:#64748b; font-size:0.75rem; text-align:center; padding:1rem;">אין עובדים ברשימה</div>';
          return;
        }

        users.forEach(u => {
          const isOff = u.type === 'offboarding';
          const total = isOff ? OFFBOARDING_TASKS.length : ONBOARDING_TASKS.length;
          const prog = Math.round((u.completed.length / total) * 100);

          const div = document.createElement('div');
          div.className = `user-card ${u.id === selectedId ? 'active' : ''}`;
          div.onclick = () => { selectedId = u.id; renderUsersList(); renderSelected(); };
          div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:bold; font-size:0.85rem;">${u.name}</span>
              <div style="display:flex; gap:0.4rem; align-items:center;">
                <span style="font-size:0.65rem; padding:0.1rem 0.4rem; border-radius:1rem; background:${isOff ? '#f59e0b22' : '#10b98122'}; color:${isOff ? '#f59e0b' : '#10b981'};">
                  ${isOff ? 'עזיבה' : 'קליטה'}
                </span>
                <button class="del-btn" onclick="deleteUser('${u.id}', event)">🗑️</button>
              </div>
            </div>
            <div style="font-size:0.75rem; color:#94a3b8; margin:0.25rem 0;">${u.department} • ${u.email}</div>
            <div style="width:100%; height:4px; background:#1e293b; border-radius:2px; overflow:hidden;">
              <div style="width:${prog}%; height:100%; background:${isOff ? '#f59e0b' : '#06b6d4'};"></div>
            </div>
          `;
          el.appendChild(div);
        });
      }

      function renderSelected() {
        const area = document.getElementById('details-area');
        const user = users.find(u => u.id === selectedId);
        if (!user) {
          area.innerHTML = '<div style="color:#64748b; text-align:center; margin-top:5rem;">בחר עובד מהרשימה או הוסף עובד חדש</div>';
          return;
        }

        const tasks = user.type === 'offboarding' ? OFFBOARDING_TASKS : ONBOARDING_TASKS;
        let tasksHtml = '';
        tasks.forEach((t, idx) => {
          const isDone = user.completed.includes(idx);
          tasksHtml += `
            <div class="task-row ${isDone ? 'done' : ''}" onclick="toggleTask(${idx})">
              <span style="font-size:0.9rem;">${t}</span>
              <span>${isDone ? '✅' : '⚪'}</span>
            </div>
          `;
        });

        area.innerHTML = `
          <div style="max-width:38rem; margin:0 auto;">
            <div style="background:#0f172a; border:1px solid #1e293b; border-radius:1rem; padding:1.5rem; margin-bottom:1.5rem;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <h2 style="font-size:1.5rem; font-weight:bold;">${user.name}</h2>
                  <p style="color:#94a3b8; font-size:0.8rem; margin-top:0.25rem;">${user.email} | מחלקת ${user.department}</p>
                </div>
                <span style="font-size:0.75rem; padding:0.25rem 0.75rem; border-radius:1rem; background:${user.type === 'offboarding' ? '#f59e0b22' : '#10b98122'}; color:${user.type === 'offboarding' ? '#f59e0b' : '#10b981'};">
                  ${user.type === 'offboarding' ? 'תהליך עזיבה' : 'תהליך קליטה'}
                </span>
              </div>
            </div>
            <h3 class="font-mono" style="font-size:0.85rem; color:#22d3ee; margin-bottom:0.75rem;">צ'ק-ליסט משימות:</h3>
            ${tasksHtml}
          </div>
        `;
      }

      async function toggleTask(idx) {
        const user = users.find(u => u.id === selectedId);
        if (!user) return;

        if (user.completed.includes(idx)) {
          user.completed = user.completed.filter(i => i !== idx);
        } else {
          user.completed.push(idx);
        }

        renderUsersList();
        renderSelected();
        await supabase.from('employees').update({ completed: user.completed }).eq('id', user.id);
      }

      async function addUser() {
        const name = document.getElementById('u-name').value;
        const email = document.getElementById('u-email').value;
        const dept = document.getElementById('u-dept').value || 'כללי';
        const type = document.getElementById('u-type').value;
        if (!name || !email) return;

        const newUser = { id: Date.now().toString(), name, email, department: dept, type, completed: [] };
        users.unshift(newUser);
        selectedId = newUser.id;

        renderUsersList();
        renderSelected();

        document.getElementById('u-name').value = '';
        document.getElementById('u-email').value = '';
        document.getElementById('u-dept').value = '';

        await supabase.from('employees').insert([newUser]);
      }

      async function deleteUser(id, e) {
        e.stopPropagation();
        users = users.filter(u => u.id !== id);
        if (selectedId === id) selectedId = users[0]?.id || null;
        renderUsersList();
        renderSelected();
        await supabase.from('employees').delete().eq('id', id);
      }

      init();
    </script>
  </body>
</html>
